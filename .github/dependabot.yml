version: 2
updates:
  # Зависимости Python: еженедельная проверка обновлений и CVE.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
