name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Evaluation
        run: python -m evaluation.run > /dev/null

  # Supply-chain аудит (docs/SECURITY.md п. 8). Блокирующий: уязвимости
  # зависимостей не должны попадать в main.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -U pip setuptools
          pip install -e .
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit --skip-editable
