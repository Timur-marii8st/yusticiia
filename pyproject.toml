[project]
name = "second-opinion"
version = "0.1.0"
description = "Верифицируемая система юридического аудита и поддержки принятия судебных решений (конкурс ВС РФ «Алгоритм правосудия. Второе мнение»)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "python-docx>=1.1",
    "pypdf>=4.2",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
pg = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
]
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.16",
    "Pillow>=10",
]

[project.scripts]
second-opinion = "second_opinion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/second_opinion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evaluation"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]
