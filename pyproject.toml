[project]
name = "second-opinion"
version = "0.1.0"
description = "Верифицируемая система юридического аудита и поддержки принятия судебных решений (конкурс ВС РФ «Алгоритм правосудия. Второе мнение»)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic[email]>=2.7",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "python-docx>=1.1",
    "pypdf>=4.2",
    "pyjwt>=2.8",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.5",
    # Генерация PDF-скана для интеграционного теста OCR
    # (tests/unit/test_ocr.py::test_real_ocr_on_scanned_image_pdf).
    # Без неё тест пропускается даже там, где tesseract установлен.
    "reportlab>=4.0",
]
pg = [
    "psycopg[binary]>=3.3.5",
    "pgvector>=0.3",
]
ocr = [
    "pytesseract>=0.3.13",
    "pdf2image>=1.16",
    "Pillow>=10",
]

[project.scripts]
second-opinion = "second_opinion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/second_opinion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Устаревание в нашем коде остаётся ошибкой.
    "error::DeprecationWarning",
    # anyio 4.15 объявил устаревшими псевдонимы anyio.abc.*, а импортирует их
    # starlette.testclient. Предупреждение целиком из зависимостей: `anyio` в
    # коде проекта не упоминается ни разу. Привязка к модулю-источнику взята
    # из upstream-ветки fix/ci-upstream-deprecation-warning — она точнее, чем
    # фильтр по одному тексту сообщения. Снять, когда starlette перейдёт на
    # anyio.from_thread.
    'ignore:The anyio\.abc\..* alias is deprecated.*:DeprecationWarning:starlette\.testclient',
    # Фильтр upstream про устаревание stdlib-модуля crypt здесь не нужен:
    # его тянул passlib, а passlib из зависимостей удалён.
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evaluation"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]
