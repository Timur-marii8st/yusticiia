[project]
name = "second-opinion"
version = "0.101.0"
description = "Верифицируемая система юридического аудита и поддержки принятия судебных решений (конкурс ВС РФ «Алгоритм правосудия. Второе мнение»)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic[email]>=2.7",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "python-docx>=1.1",
    "pypdf>=4.2",
    "pyjwt>=2.8",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.5",
    "reportlab>=4.0",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "httpx2>=2.13",
]
pg = [
    "psycopg[binary]>=3.3.5",
    "pgvector>=0.3",
]
ocr = [
    "pytesseract>=0.3.13",
    "pdf2image>=1.16",
    "Pillow>=10",
]

[project.scripts]
second-opinion = "second_opinion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/second_opinion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error::DeprecationWarning",
    'ignore:The anyio\.abc\..* alias is deprecated.*:DeprecationWarning:starlette\.testclient',
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evaluation"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src/second_opinion"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
files = ["src/second_opinion"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "second_opinion.api.*"
disable_error_code = ["return-value", "misc"]
