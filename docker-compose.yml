services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: second_opinion
      POSTGRES_USER: second_opinion
      POSTGRES_PASSWORD: second_opinion
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    profiles: ["postgres"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U second_opinion -d second_opinion"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: second-opinion
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      SO_LLM_PROVIDER: mock
      SO_MAX_UPLOAD_BYTES: "5242880"
      SO_STORAGE_BACKEND: ${SO_STORAGE_BACKEND:-file}
      SO_DATABASE_URL: ${SO_DATABASE_URL:-}
      SO_AUTH_TOKEN: ${SO_AUTH_TOKEN:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        required: false

volumes:
  pgdata:
